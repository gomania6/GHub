# === Основной конфиг GHub ===

# Предмет для взаимодействия
item:
  enabled: true          # true - предмет будет выдаваться и работать, false - предмет будет отключен и удален у игроков
  material: COMPASS      # Материал предмета
  slot: 0                # Слот в хотбаре (0-8)
  name: "&6Server Selector"  # Название предмета с цветами
  lore:
    - "&7Кликните, чтобы открыть меню"
    - "&7Выберите сервер для перехода"
  function: "[bungee]lobby"  # [console]команда или [bungee]сервер

# Режим игры
gamemode:
  enabled: false         # Включить/выключить смену режима игры при входе
  default: "ADVENTURE" # Режим игры по умолчанию (SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR)

# Сообщения
messages:
  welcome-spawn: "&aДобро пожаловать на спавн!"
  cannot-drop: "&cВы не можете выбросить этот предмет!"
  no-permission: "&cУ вас нет прав для этого действия!"
  reload-success: "&aКонфиг успешно перезагружен!"
  usage: "&eИспользование: /ghub [reload|spawn]"

  # Сообщение при спавне включено/выключено
  welcome-spawn-enabled: true